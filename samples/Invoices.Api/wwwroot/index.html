<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoices · Kimlik sample</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>Invoices</h1>
    <div class="session">
      <span id="greeting"></span>
      <button id="sign-in" hidden>Sign in</button>
      <button id="sign-out" class="secondary" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <p id="status" role="status"></p>

    <section id="signed-out" hidden>
      <p>This app signs you in with Kimlik and calls its API with your access token. The API checks your permissions.</p>
    </section>

    <section id="signed-in" hidden>
      <h2>Your access</h2>
      <dl>
        <dt>Roles</dt><dd id="roles"></dd>
        <dt>Permissions</dt><dd id="permissions"></dd>
        <dt>Plan</dt><dd id="plan"></dd>
      </dl>
      <div class="actions">
        <button id="become-accountant" class="secondary">Become an accountant (demo)</button>
        <button id="upgrade" class="secondary">Upgrade to Pro (demo)</button>
      </div>

      <h2>Invoices</h2>
      <div class="actions">
        <button id="load-invoices">Load invoices</button>
        <button id="export" class="secondary">Export (Pro)</button>
      </div>
      <table>
        <thead><tr><th>Customer</th><th>Amount</th><th>Created by</th></tr></thead>
        <tbody id="invoices"></tbody>
      </table>

      <form id="new-invoice">
        <h3>New invoice</h3>
        <label>Customer <input name="customer" required maxlength="100"></label>
        <label>Amount <input name="amount" type="number" min="0.01" step="0.01" required></label>
        <button type="submit">Create</button>
      </form>
    </section>
  </main>

  <!-- oidc-client-ts runs the authorization code flow with PKCE and renews tokens with the refresh token. -->
  <script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3.5.0/dist/browser/oidc-client-ts.min.js"
          integrity="sha384-PTRVZ+Irwhdd38ou1In8Amo5/CLZci9zRlwSiS7/OUYo6TbYw8QYTCkn6rKod6Tb"
          crossorigin="anonymous"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
