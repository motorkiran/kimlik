{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kimlik.fullname" . }}
  labels:
    {{- include "kimlik.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.keys.connectionString }}: {{ required "secret.values.connectionString is required without secret.existingSecret" .Values.secret.values.connectionString | quote }}
  {{ .Values.secret.keys.masterKey }}: {{ required "secret.values.masterKey is required without secret.existingSecret: openssl rand -base64 32" .Values.secret.values.masterKey | quote }}
  {{- with .Values.secret.values.smtpPassword }}
  {{ $.Values.secret.keys.smtpPassword }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.values.bootstrapAdminPassword }}
  {{ $.Values.secret.keys.bootstrapAdminPassword }}: {{ . | quote }}
  {{- end }}
{{- end }}
