{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kimlik.serviceAccountName" . }}
  labels:
    {{- include "kimlik.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Kimlik does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
