name: Release

# Pushing a version tag, such as v0.1.0, releases that version: a multi-arch container image on GitHub Container
# Registry, a GitHub release with the packages, and the packages on NuGet once the NUGET_API_KEY secret is set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          for project in src/Kimlik.Contracts sdk/Kimlik.Client sdk/Kimlik.AspNetCore; do
            dotnet pack "$project" --configuration Release --no-build -p:Version="$VERSION" --output artifacts
          done

      # Conditions cannot read secrets, so this step tells whether the key is set, without exposing it to other steps.
      - name: Check for a NuGet key
        id: nuget
        run: echo "enabled=${{ secrets.NUGET_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish packages
        if: steps.nuget.outputs.enabled == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish container image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          tags="$VERSION"
          # Pre-releases, such as 0.2.0-rc.1, do not move "latest".
          if [[ "$VERSION" != *-* ]]; then tags="$tags;latest"; fi
          dotnet publish src/Kimlik.Server --configuration Release -p:Version="$VERSION" \
            -t:PublishContainer -p:ContainerRegistry=ghcr.io -p:ContainerRepository="${GITHUB_REPOSITORY,,}" \
            -p:ContainerImageTags="\"$tags\"" -p:ContainerRuntimeIdentifiers="\"linux-x64;linux-arm64\""

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "Kimlik $VERSION" --generate-notes $prerelease
